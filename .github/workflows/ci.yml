name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build client
        run: xmake build client

      - name: Build server
        run: xmake build server
        
      - name: Build proxy
        run: xmake build proxy
        
      - name: Build launcher
        run: xmake build launcher

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build server
        run: xmake build -y server

      - name: Run server
        run: timeout 5 xmake run server || [ $? -eq 124 ]
